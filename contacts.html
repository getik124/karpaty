<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Контакти — Карпатські нотатки</title>
<meta name="description" content="Блог про походи та гори в Українських Карпатах">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="header">
  <div class="wrap">
    <a class="logo" href="index.html">Карпатські нотатки</a>
    <input type="checkbox" id="menu-toggle" aria-label="Відкрити меню">
    <label class="burger" for="menu-toggle" aria-hidden="true">☰</label>
    <nav class="nav" aria-label="Головна навігація">
      <a href="index.html">Блог</a>
      <a href="gallery.html">Галерея</a>
      <a href="contacts.html" aria-current="page">Контакти</a>
    </nav>
  </div>
  <div class="trail"></div>
</header>
<main>
<section>
  <div class="wrap subscribe">
    <div class="info">
      <h2>Зворотний зв’язок</h2>
      <p>Питання про маршрути, пропозиції спільного походу або просто враження від прочитаного.</p>
      <dl><dt>Пошта</dt><dd>hello@karpaty.example</dd><dt>Відповідь</dt><dd>протягом двох днів</dd></dl>
    </div>
    <form action="#" method="post">
      <label>Ім’я<input type="text" name="name" required autocomplete="name"></label>
      <label>Електронна пошта<input type="email" name="email" required autocomplete="email"></label>
      <label>Повідомлення<textarea name="message" rows="5" required></textarea></label>
      <button class="btn" type="submit">Надіслати</button>
    </form>
  </div>
</section>
</main>
<footer class="footer"><div class="wrap"><span>© 2026 Карпатські нотатки</span><span>Записи з гір, поки є зв’язок</span></div></footer>
</body>
